name: Android Production Release

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    environment: production
    env:
      API_BASE_URL: https://api.lakshyaaerotech.com/api
      BOOKING_RATE_PER_ACRE: ${{ vars.BOOKING_RATE_PER_ACRE || '800' }}
      ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
      ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
      ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Validate protected release secrets
        shell: bash
        run: |
          for name in ANDROID_KEYSTORE_BASE64 ANDROID_KEYSTORE_PASSWORD ANDROID_KEY_PASSWORD ANDROID_KEY_ALIAS; do
            if [ -z "${!name}" ]; then
              echo "::error::Missing required production environment secret: $name"
              exit 1
            fi
          done

      - name: Configure Android upload signing
        shell: bash
        run: |
          mkdir -p android/keystore
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > android/keystore/upload.jks
          {
            printf 'storePassword=%s\n' "$ANDROID_KEYSTORE_PASSWORD"
            printf 'keyPassword=%s\n' "$ANDROID_KEY_PASSWORD"
            printf 'keyAlias=%s\n' "$ANDROID_KEY_ALIAS"
            printf 'storeFile=../keystore/upload.jks\n'
          } > android/key.properties

      - run: flutter pub get
      - run: flutter analyze --no-fatal-warnings --no-fatal-infos
      - run: flutter test

      - name: Build Play Store app bundle
        run: >
          flutter build appbundle --release
          --dart-define=API_BASE_URL="$API_BASE_URL"
          --dart-define=BOOKING_RATE_PER_ACRE="$BOOKING_RATE_PER_ACRE"
          --obfuscate
          --split-debug-info=build/symbols/android

      - name: Build signed device-testing APKs
        run: >
          flutter build apk --release --split-per-abi
          --dart-define=API_BASE_URL="$API_BASE_URL"
          --dart-define=BOOKING_RATE_PER_ACRE="$BOOKING_RATE_PER_ACRE"
          --obfuscate
          --split-debug-info=build/symbols/android

      - name: Upload Play Store bundle
        uses: actions/upload-artifact@v4
        with:
          name: lakshya-aerotech-play-bundle
          path: build/app/outputs/bundle/release/app-release.aab
          if-no-files-found: error
          retention-days: 30

      - name: Upload device-testing APKs
        uses: actions/upload-artifact@v4
        with:
          name: lakshya-aerotech-testing-apks
          path: build/app/outputs/flutter-apk/app-*-release.apk
          if-no-files-found: error
          retention-days: 14

      - name: Upload Android symbols
        uses: actions/upload-artifact@v4
        with:
          name: lakshya-aerotech-android-symbols
          path: build/symbols/android
          if-no-files-found: error
          retention-days: 90
