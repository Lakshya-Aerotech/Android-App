name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      - run: npm test

  flutter-android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter analyze --no-fatal-warnings --no-fatal-infos
      - run: flutter test
      - name: Create ephemeral CI signing key
        run: |
          mkdir -p android/keystore
          keytool -genkeypair -keystore android/keystore/ci-upload.jks -storepass ci-not-secret -keypass ci-not-secret -alias ci-upload -keyalg RSA -keysize 2048 -validity 1 -dname "CN=CI, OU=CI, O=Lakshya, L=Hyderabad, ST=Telangana, C=IN"
          cp android/key.properties.ci android/key.properties
      - run: flutter build appbundle --release --dart-define=API_BASE_URL=https://api.example.invalid/api --dart-define=BOOKING_RATE_PER_ACRE=800

  flutter-ios:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter build ios --simulator --debug --dart-define=API_BASE_URL=https://api.example.invalid/api --dart-define=BOOKING_RATE_PER_ACRE=800
