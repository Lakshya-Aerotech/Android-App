name: lakshya_aerotech
description: Lakshya Smartguard systems - Smart Drone Solutions for Modern Agriculture
publish_to: "none"

version: 1.0.0+1

environment:
  sdk: ">=3.12.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # Firebase
  firebase_core: ^3.15.2
  firebase_auth: ^5.3.3
  cloud_firestore: ^5.6.2
  firebase_storage: ^12.1.2
  firebase_messaging: ^15.2.10
  flutter_local_notifications: ^17.2.4

  # State Management
  flutter_riverpod: ^2.5.0

  # Navigation
  go_router: ^14.2.0

  # Fonts
  google_fonts: ^6.2.1
  pinput: ^5.0.0
  image_picker: ^1.1.2
  file_picker: ^8.0.3
  path: ^1.9.0
  flutter_map: ^7.0.2
  latlong2: ^0.9.1
  geolocator: ^13.0.2
  maps_launcher: ^3.0.0+1
  shared_preferences: ^2.3.5
  intl: ^0.20.2
  url_launcher: ^6.3.0
  excel: ^4.0.6
  path_provider: ^2.1.5
  share_plus: ^10.1.4
  dio: ^5.10.0
  webview_flutter: ^4.14.1

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^5.0.0
  flutter_launcher_icons: ^0.13.1

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/images/lakshya_logo.png"
  min_sdk_android: 21

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/icons/

  # Uncomment when you add custom fonts
  # fonts:
  #   - family: Poppins
  #     fonts:
  #       - asset: assets/fonts/Poppins-Regular.ttf
  #       - asset: assets/fonts/Poppins-Medium.ttf
  #         weight: 500
  #       - asset: assets/fonts/Poppins-SemiBold.ttf
  #         weight: 600
  #       - asset: assets/fonts/Poppins-Bold.ttf
  #         weight: 700
