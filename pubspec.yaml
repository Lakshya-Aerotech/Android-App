name: lakshya_aerotech
description: Lakshya Aerotech - Smart Drone Solutions for Modern Agriculture
publish_to: "none"

version: 1.0.0+1

environment:
  sdk: ">=3.12.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # Firebase
  firebase_core: ^3.15.2
  firebase_auth: ^5.3.3
  cloud_firestore: ^5.6.2

  # State Management
  flutter_riverpod: ^2.5.0

  # Navigation
  go_router: ^14.2.0

  # Fonts
  google_fonts: ^6.2.1
  pinput: ^5.0.0
  shared_preferences: ^2.3.5
  intl: ^0.19.0

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/icons/

  # Uncomment when you add custom fonts
